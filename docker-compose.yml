services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: risk_agents
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d risk_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD:-admin}@postgres:5432/risk_agents
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-opencode_go}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-https://opencode.ai/inference/openai/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD:-admin}@postgres:5432/risk_agents
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-opencode_go}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-https://opencode.ai/inference/openai/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-}
    command: celery -A app.tasks.celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
